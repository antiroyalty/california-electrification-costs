  "eac.alpha_batt_npv": {
    "title": "Shared Battery Capital Annualization with Remaining Value",
    "formula": "alpha_batt = [sum(j=0..k-1, (1+r)^(-j*n)) - ((k*n-N)/n)*(1+r)^(-N)] * CRF(r,N), where k=ceil(N/n).",
    "assumptions": {
      "units": "Annual battery capital cost per dollar of modeled purchase cost; r is the real annual discount rate, n is battery service life in years, and N is the study period in years.",
      "central_case": "N=25, matching the assumed solar life; n=15. Purchases occur at years 0 and 15. At year 25 credit one-third of replacement cost, then discount that credit to year 0.",
      "cost_basis": "Initial and replacement purchases use the same real cost and incentive treatment. The remaining-value credit uses that same replacement-cost basis. Future price and incentive changes are not forecast.",
      "remaining_value": "Value is proportional to unused service life. This estimates remaining service value, not a resale price.",
      "worked_example": "At r=0.07 the coefficient is 0.111642025 per year. For a $10,000 purchase cost: year-25 remaining value $3,333.33, present credit $614.16, annual battery capital cost $1,116.42.",
      "boundaries": "Count purchases strictly before study end; do not buy at the terminal date. Credit only the last battery. Multiple replacements are included when required. Zero interest gives 1/n. Reject negative or non-finite discount rates and nonpositive or non-finite lifetimes and study periods.",
      "integration": "Step 9b, EAC collectors, county annual-cost charts, and SAM capital-cost scoring call this shared coefficient. EAC reporting has no alternative npv_framing switch. Dispatch constraints are unchanged.",
      "pv": "Solar life equals the study period, so PV uses CRF(r,N) for one purchase with no remaining life at study end.",
      "result_status": "Implemented and covered by independent cash-flow and integration tests, including Alameda free sizing and a fixed 10 kWh battery. The September 11 core rerun at 8a98b96 completed 47 counties and three paper scenarios plus the supporting baseline at 8760 hours. All 49 statewide checks passed. Other sensitivities retain earlier versions. See docs/research_logs/2026-09-11.md."
    },
    "data_sources": {
      "remaining_value_method": "NIST Life-Cycle Costing Manual, section 4.5.3: https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=934909",
      "solar_period_context": "DOE typical photovoltaic performance period of 20-30 years: https://www.energy.gov/cmei/femp/life-cycle-photovoltaic-systems-prepare-end-performance-period"
    },
    "code": [
      "evaluations/eac.py:alpha_batt_npv",
      "pipeline/steps/step9b_cooptimize_core.py:_solve_lp",
      "helpers/diagnostics_cost_plots.py:create_cost_waterfall_chart",
      "helpers/diagnostics_cost_plots.py:create_storage_value_vs_cost_chart",
      "experiments/sam_parallel.py:score",
      "tests/battery_annualization_test.py"
    ],
    "notes": "Legacy standalone experiments/solar_size_sweep.py, battery_size_sweep.py, combined_sweep.py and pipeline/steps/step9_optimize_solar_storage.py retain service-life CRFs. Auxiliary NPV diagnostics omit replacement and remaining value. Align those tools before using them for comparisons under this method."
  },
