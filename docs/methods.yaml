      "correction_status": "The September 15 matched cost refresh at 668a07e applies corrected ICE arithmetic, revised ICE/EV maintenance, and Alpine's explicit proxy to both households. Relative to original September 14 costs, gas/ICE falls by 543.666666666667 USD/year except Alpine, which rises by 1727.178694158076 USD/year; electric/EV rises by 202.773333333333 USD/year everywhere. These changes cancel within adoption differences. Step 15's incentive-selection fix affects auxiliary payback; publication EAC already selected its incentive case. Original archived results remain unchanged. See docs/research_logs/2026-09-15-cost-refresh.md."
