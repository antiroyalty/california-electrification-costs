  "eac.alpha_batt_npv": {
    "title": "Battery Capex Coefficient under NPV Framing",
    "formula": "alpha_batt = (1 + (1+r)^(-n_batt)) / PVA(r, N)",
    "assumptions": {
      "derivation": "The current optimizer uses a 25-year horizon with purchases at year 0 and year 15, and no residual-value credit at year 25. K_batt = 1 + (1+r)^(-15) is the present value of both purchases. Dividing by PVA(r,25) = (1-(1+r)^(-25))/r converts to annual-equivalent cost.",
      "horizon_origin": "Commit 063d028 (2026-03-03) replaced the optimizer's asset-by-asset CRFs with the replacement formula and tied the horizon to pv_life_yrs=25. The research author has now explicitly approved a 25-year study period matching the assumed solar life, while retaining a 15-year battery life.",
      "horizon_boundary": "The statewide collector currently annualizes each asset over its own life; it is not a 15-year project projection. The current replacement helper always includes a second purchase and no remaining-value credit. See research.approved_battery_annualization for the approved correction, which is not yet implemented.",
      "vs_crf": "At r=0.07, n_batt=15, N=25: alpha_batt=0.116912 per year versus CRF(r,15)=0.109795 per year, about 6.5% higher. This comparison is for the declared horizon and lifetimes, not a general inequality.",
      "reporting_boundary": "Step 9b uses alpha_batt_npv. The statewide EAC collectors currently call compute_eac_from_inputs without npv_framing=True and therefore use the 15-year CRF. Billing is reconciled; this capital annualization difference remains follow-up work.",
      "pv_unchanged": "For PV, n_pv = N = 25, so K_pv = 1 and alpha_pv = 1/PVA = CRF(r, N). No change to PV coefficient."
    },
    "code": [
      "evaluations/eac.py:alpha_batt_npv",
      "pipeline/steps/step9b_cooptimize_core.py:_solve_lp"
    ]
  },
