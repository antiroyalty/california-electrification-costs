      "lifetimes": "solar=25, storage=15, appliance rows use lifetime_years (default 15 if missing)",
      "incentives": "full/half/no incentives applied to PV/storage capex",
      "capital_recovery_factor": "CRF = r(1+r)^n / ((1+r)^n - 1)",
