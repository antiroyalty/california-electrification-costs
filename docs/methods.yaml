  "research.approved_annual_accounting": {
    "title": "Implemented Annual NBT Simplifications",
    "formula": "B = F + N + sum_p max(C_p - E_p, 0); C_p = sum_h w_h i_h r_imp[p,h]; E_p = sum_h w_h x_h r_exp[p,h].",
    "assumptions": {
      "status": "All three changes are implemented. The September 11 core rerun at 8a98b96 validates the three paper scenarios across 47 counties at 8760 hours. ITC, battery-price, and NEM 2 sensitivities retain earlier versions. Current findings and claim implications are recorded in docs/research_logs/2026-09-11.md.",
      "changes": "Exclude ACC Plus; constrain annual exported kWh to be no greater than annual imported kWh; settle base credits annually within the existing utility credit pools.",
      "preserved": "Hourly prices and dispatch, non-bypassable and fixed charges, SCE's combined pool, PG&E/SDG&E component restrictions, and zero additional value for unused credits beyond the modeled year.",
      "limitations": "Omitting the bonus can understate eligible-household savings. With fixed dispatch and zero opening banks, its current-year benefit is at most annual exported kWh times the bonus rate. Standard 2026 rates are PG&E $0.0088/kWh, SCE $0.016/kWh, SDG&E $0/kWh; this bound does not establish unchanged optimal sizing. The research export cap excludes annual net-exporting dispatches and can affect the electrification comparison when binding. Compare affected claims with pre-cap revision 9b61415 under matched assumptions. Annual timing can overstate SDG&E savings relative to the former no-backward-offset convention. At fixed flows, the difference is bounded by the sum across pools of min(unused annual-end credit, earlier eligible payments) in that prior model."
    },
    "notes": "See docs/RESEARCH_METHODS.md for equations and validation boundaries. ACC Plus source rates remain archived in data/tariffs/acc_plus_rates.csv. They are not optional inputs to the research model."
  },
