    "title": "Approved Shared Battery Annualization - Not Yet Implemented",
    "formula": "Annual battery capital cost = C * [1 + (1+r)^(-15) - (1/3)*(1+r)^(-25)] / sum(t=1..25, (1+r)^(-t)).",
    "assumptions": {
      "status": "Approved by the research author; pending implementation, independent cash-flow tests, and regenerated results. Current optimizer and reporting coefficients remain as documented in eac.alpha_batt_npv.",
      "periods": "Study period 25 years, matching the assumed solar life. Battery service life 15 years; buy initially at year 0 and replace at year 15.",
      "remaining_value": "At year 25 the replacement has five years remaining. Credit 5/15 of its modeled purchase cost at year 25 and discount this amount back to year 0. This is a proportional remaining-service-value estimate, not a resale-price forecast.",
      "cost_basis": "C is the modeled battery purchase cost. Retain the same real cost and incentive treatment for the initial and replacement purchases. Apply the one-third credit to that same replacement-cost basis. Future changes in prices and incentives are not forecast.",
      "worked_example": "For C=$10,000 and r=0.07: year-25 remaining value $3,333.33; present value of that credit $614.16; shared annual battery capital cost $1,116.42. The coefficient is 0.111642025 per year.",
      "integration": "Optimization and EAC reporting must use one shared calculation. This changes capital annualization, not battery dispatch constraints or the pending tariff simplifications.",
      "validation": "Run existing tests before implementation. Add independent purchase/replacement/remaining-value examples, zero-discount and replacement-boundary cases, and optimizer-to-reporting reconciliation. Investigate failed existing tests before changing their expectations."
    },
    "data_sources": {
      "remaining_value_method": "NIST Life-Cycle Costing Manual, section 4.5.3: https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=934909",
      "solar_period_context": "DOE typical photovoltaic performance period of 20-30 years: https://www.energy.gov/cmei/femp/life-cycle-photovoltaic-systems-prepare-end-performance-period"
    },
    "notes": "The user-approved 25-year period and one-third remaining-value convention replace the earlier open annualization choice. Implementation is the next review unit after this methods audit."
