  "electrification.matched_comparison": {
    "title": "Matched full-electrification and solar/storage adoption comparison",
    "formula": "Let A=C_gas,no_solar, B=C_gas,optimized, C=C_electric,no_solar, D=C_electric,optimized. Electrification savings without solar=A-C; with optimized equipment=B-D. Gas adoption savings=A-B; electric adoption savings=C-D. Package effect=(C-D)-(A-B)=(B-D)-(A-C). The lowest modeled cost allowing each household to decline adoption is min(A,B) for gas and min(C,D) for electric. All values are USD/year.",
    "assumptions": {
      "households": "baseline_ice_car_coopt versus full_electric_ev_coopt; includes building appliances and vehicle. Both choose PV/storage freely, including zero capacity. No separate appliance-versus-EV attribution.",
      "accounting": "Use the shared county EAC collector at 7% real discount, full incentive capture, 25-year solar/study period and 15-year battery life with replacement and remaining value. Within each household, appliance capital, gas bills and vehicle operating costs must match between solar choices. Negative net appliance costs and vehicle adjustments remain valid.",
      "tariffs": "Match exact electricity columns between households within each solar choice. No-solar: PG&E E-TOU-D, SCE TOU-D-4-9PM, SDG&E TOU-DR1. Optimized: required NBT import plans E-ELEC, TOU-D-PRIME, EV-TOU-5. Adoption savings include the plan transition. Report capacities; zero PV and storage cannot establish an installation benefit.",
      "tariff_decomposition": "Use the saved optimizer Load Profile and timestamps, verified against the source profile's rotation to January 1. Bill this aligned load without exports on both the NBT schedule and the retail plan. Define calendar term H=B_retail,original_calendar-B_retail,2026; plan term T=B_retail,2026-B_NBT,no_DER; equipment term Q=B_NBT,no_DER-B_NBT,optimized-K_PV-K_battery. Then S=H+T+Q and P=delta_H+delta_T+delta_Q. Check Q is nonnegative within its numerical bound, because zero capacity is feasible on the same NBT load/calendar. This is not a tariff-eligibility or cheapest-eligible-plan comparison. The initial unaligned attribution diagnostic is archived as invalid; primary four-case costs are unchanged.",
      "calendar_limitation": "Existing retail billing uses the source profile dates, while NBT uses 2026. Rebilling retail on the optimizer's aligned 2026 calendar changes individual no-solar bills by at most $8.13/year and the package effect by at most $3.64/year in this run. All 47 package-effect signs remain positive; its median becomes $309.11 rather than $307.60. Calendar unification remains a reporting improvement, not a new optimization requirement.",
      "validation": "Require all four unique cells per expected county, finite costs and capacities, totals that reconcile to their components, zero DER costs/sizes in no-solar cases, paired utility/plan/source/vintage/battery-bound/charging/export/cost-tolerance metadata, identical weather files, and 8760 finite nonnegative demand observations per household. Exact bill columns and scenario timestamps are checked before collection; no latest-file or unmatched-plan substitution is allowed.",
      "numerical_bound": "For B-D and the package effect, u=gap_gas+gap_electric+abs(d_gas)+abs(d_electric)+0.0001 USD/year. Each gap is the recorded solver certificate gap. d is reported PV/storage annual capital plus electricity bill minus saved Coopt Total Cost. It captures capacity-rounding differences. The final term bounds two objectives rounded to four decimals. This is a conservative numerical cost bound, not a bound on modeling assumptions or capacities.",
      "figure": "Plot gas/ICE adoption savings on x and electric/EV adoption savings on y. Points above the equal-savings diagonal indicate a positive package effect. Count positive effects only when they exceed u; report the unweighted median of county effects, not a difference of medians. Each axis shows epsilon+abs(d)+0.00005 USD/year numerical error bars, not confidence intervals. The renderer verifies the source receipt and records source/code/output hashes and plotted statistics.",
      "provenance": "Record declared model SHA, reporting SHA/code hash, exact bill timestamps, matched settings, SHA-labelled completion markers, and fingerprints of capital ledgers, PV summaries, capacity summaries, weather, loads and annual bills. Reject input changes during collection. Hashes identify the collected files; generation history and overrides still depend on the isolated run record.",
      "status": "The September 15 cost refresh at 668a07e rebuilds all 188 matched cells from the validated September 14 optimizations and bills at 11b7dba. With both systems optimized, electric/EV costs less in 8 counties and more in 39; allowing adoption to be declined gives 7 and 40. Both have median electrification savings of -415.54 USD/year. The package effect remains positive in all 47 counties, median 307.60 USD/year. All 1692 ledger rows and 188 cells reconcile to expected vehicle-only changes. The original 94 bill replays and 98 statewide checks remain evidence for the unchanged optimization and bills. See docs/research_logs/2026-09-15-cost-refresh.md. Older three-case reports and county diagnostic cost displays remain unchanged."
    },
    "code": [
      "figure_builder/electrification.py:build_electrification_source",
      "figure_builder/electrification.py:validate_electrification_costs",
      "figure_builder/electrification.py:summarize_electrification_costs",
      "figure_builder/charts.py:plot_matched_adoption_savings",
      "figure_builder/electrification_figure.py:render_adoption_figure",
      "figure_builder/tests/test_electrification.py"
    ]
  },
