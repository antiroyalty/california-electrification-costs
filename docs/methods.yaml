  "npv.npv": {
    "title": "Net Present Value (NPV)",
    "formula": "NPV = sum_{t=0..N} cashflow_t / (1 + r)^t",
    "assumptions": {
      "discount_rate": "real rate, provided by caller",
      "cashflow_t": "t=0 is up-front cost; t>=1 are annual flows"
    },
    "data_sources": {
      "cashflows": "caller-provided sequences (varies by evaluation)"
    },
    "code": [
      "evaluations/npv.py:npv"
    ],
    "notes": "No sign convention enforced; callers must supply costs/benefits."
  },
  "npv.compute_npv_details_from_inputs": {
    "title": "NPV Details (Solar+Storage vs All Electrification)",
    "formula": "NPV = -capex + sum_{t=1..N} savings_t / (1 + r)^t",
    "assumptions": {
      "solar_storage_savings": "scenario_cost - scenario_solar_cost",
      "all_electrification_savings": "baseline_cost - scenario_solar_cost",
      "horizon_years": "default 25",
      "discount_rate": "default 0.07",
      "cash_flow_scope": "Upfront equipment cost plus constant annual operating savings. This helper does not add battery replacement or residual equipment value; it is not the Step 9b objective."
    },
    "data_sources": {
      "baseline_cost": "totals results (baseline)",
      "scenario_cost": "totals results (scenario, no solar)",
      "scenario_solar_cost": "solarstorage totals results",
      "pv_storage_net_capex": "capital_costs_summary_with_pv",
      "electrification_net_capex": "capital_costs_<scenario>_<housing>"
    },
    "code": [
      "evaluations/npv.py:compute_npv_details_from_inputs",
      "helpers/diagnostics_data.py:compute_npv_details"
    ]
  },
  "npv.annuity_factor": {
    "title": "Annuity Factor (NPV to EAC)",
    "formula": "A = r / (1 - (1 + r)^-n)",
    "assumptions": {
      "returns": "1/n when r <= 0; 1.0 when n <= 0"
    },
    "code": [
      "evaluations/npv.py:annuity_factor"
    ],
    "notes": "Used to convert NPV to an equivalent annual amount."
  },
  "eac.crf": {
    "title": "Capital Recovery Factor (CRF)",
    "formula": "CRF = r(1+r)^n / ((1+r)^n - 1)",
    "assumptions": {
      "returns": "1/n when r <= 0; 1.0 when n <= 0"
    },
    "code": [
      "evaluations/eac.py:crf"
    ]
  },
