  "optimization.solar_storage": {
    "title": "Implemented Solar and Storage Sizing Objective",
    "formula": "Minimize annualized PV cost + annualized battery cost + modeled electricity bill + specified battery-throughput cost.",
    "assumptions": {
      "decisions": "Continuous PV capacity in kW, battery energy capacity in kWh, battery power in kW, and hourly operation. Appliance and vehicle choices are fixed by the scenario. Zero PV and zero storage are feasible choices in free sizing. Continuous sizing does not enforce minimum commercial unit sizes.",
      "physical_constraints": "Conserve energy; enforce load balance, battery power and charge limits, and one meter direction per interval. Central runs prohibit grid charging and allow battery export.",
      "grid_charging_sensitivity": "The existing optional branch permits grid charging and tracks separate solar-origin and grid-origin stored energy. Both can supply household demand; only solar-origin energy can be exported. Charge purchases enter annual billing and the annual import/export cap. The completed September 17 sensitivity covers 47 counties and both matched households, holding loads, weather, tariffs, costs, research sizing bounds, and full-year chronology fixed. All 92 PG&E/SCE cases select zero storage within $1/year of optimal and use no grid charging; the maximum remaining possible benefit is $0.980842/year. Explicit separate San Diego runs allow a $30/year gap and establish certified savings ranges of approximately $29.16-$44.16/year for gas/ICE and $57.27-$85.14/year for electric/EV. Their feasible 1.50 and 2.87 kWh batteries are not $1-converged optimal sizes. See docs/research_logs/2026-09-17-grid-charging.md for selection and validation. This modeled dispatch rule does not establish utility interconnection approval or isolate tariff causality from county load and weather differences.",
      "grid_charging_validation": "Twelve analytical checks across the three utilities verify charging costs and losses, prohibit grid-origin exports even under high export credits, permit solar exports alongside grid charging for household use, and allow expensive storage to be declined. The existing focused suite passed 157 tests before additions; the combined suite passed 169. All 94 full-year cases passed matched-input, physical, energy-origin, and bill checks. A separate readback reconciles all 94 serialized bills and origin balances. Savings lie between max(0, L_off-U_on) and U_off-L_on, with $0.0001 baseline serialization allowance. If a new candidate never charges from the grid, it is feasible under both rules and tightens the savings ceiling to its own cost gap plus $0.000001. Existing tests remain unchanged.",
      "sizing_domain": "Default optimized battery ceiling 40 kWh, power at most 1C, and available annual PV generation at most 150% of load for NBT or 100% for NEM 2. NBT also requires weighted annual exports <= weighted annual imports. Exports include solar and battery flows; imports include household supply and any permitted grid charging. Fixed designs face the same cap and can curtail unused generation. County reporting and preflight reject profiles above the cap.",
      "chronology": "Full-year 8760-hour runs have cyclic annual battery charge. Weighted 12x24 sensitivities close each representative day's battery cycle and weight annual dollars and energy by days per month.",
      "solver": "NBT and NEM 2 use HiGHS by default with SciPy >=1.16.1, the validated minimum version. The earlier SciPy 1.11.4 wrapper drops the absolute-gap setting. CBC can be selected explicitly. NBT annual credit accounting adds one continuous remaining-charge variable per eligible pool, constrained to be nonnegative and at least annual charges minus annual credits. Financial credit accounting needs no binary variables. Physical meter-direction binaries remain. After any first-round NBT meter violation, add constraints for all price-risk hours (export >= import within 1e-9), as well as observed violations, where physical bounds permit both directions. Annual credit saturation can hide risky hours until later rounds. A valid first relaxation adds no meter binaries. Non-NBT models retain the existing more-than-96-violations trigger. This changes constraint-generation order, not the objective, feasible set, time budget, or acceptance checks. The matched run's San Diego gas override is now the standard NBT path.",
      "solver_precision": "Default epsilon = $1/year. Accept only a physically valid, replayed objective C with 0 <= C - L <= epsilon, where L is the strongest certified lower bound across solver rounds. Dollar comparisons allow 1e-6 for floating-point roundoff. HiGHS and CBC use an absolute MIP gap and zero relative gap. CBC printed lower bounds are adjusted downward for display rounding. The certificate uses full-precision capacities; downstream capacity rounding is separate. A cost bound does not guarantee identical capacities or an unchanged battery-adoption threshold. A tighter tolerance is configurable.",
      "meter_constraint_validation": "The three-hour regression reproduces a hidden second violation: batching takes two solves instead of three and preserves the independently calculated $1.60 bill. In the paired 8760-hour benchmark based on 0d0e9ac, San Diego gas changes from a 314-second failure to a 35-second success; electric/EV changes from 96 to 37 seconds. Alameda and Los Angeles gas cases increase from 169 to 187 and 161 to 168 seconds. Accepted objectives and capacities match; all four revised bills replay exactly and have cost gaps below $1/year. These are single measurements, not a statewide speedup or runtime guarantee. See analysis_results/sd_gas_runtime_0d0e9ac/README.md.",
      "solver_budget": "Config.coopt_solver (SolverOptions) selects the backend, annual cost gap, and a default 300-second budget per sizing/dispatch problem across model construction and all meter rounds. SolverRun owns that shared deadline, backend selection, round certificates, and final cost-bound validation. Step 9b separately constructs the model and validates physical and billing results. Data preparation is outside that budget; each optional sensitivity solve has a separate budget. Solver time limits are cooperative and finalization can add overhead. A timeout without a physically valid candidate and sufficient cost certificate fails clearly. No automatic backend retry occurs. Step 9b saves settings, elapsed time, and bounds in the capacity CSV and coopt_solver_<county>.json. The 8a98b96 publication results retain their original precision and runtimes.",
      "bill_replay": "The NBT result is replayed through numeric shared accounting; a bill discrepancy above $0.001 is rejected. Tests reconcile capital formulas using full-precision capacities. Persisted capacity CSVs still round to two decimals. The core rerun at 8a98b96 had a maximum annual capital difference of $1.37 in San Mateo; all 141 annual bills reconciled. Preserving artifact precision is a separate follow-up."
    },
    "code": [
