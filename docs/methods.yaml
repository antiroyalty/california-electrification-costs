{
  "constants": {
    "title": "Evaluation Constants",
    "constants": {
      "LIFETIMES_DEFAULT": "solar=25, storage=15, heat_pump=15, induction_stove=15, water_heater=15 (years)",
      "THERM_TO_KWH": "29.3001 kWh/therm"
    },
    "code": [
      "evaluations/constants.py"
    ],
    "notes": "These constants are used across evaluations unless overridden by call sites."
  },
  "energy.therms_to_kwh": {
    "title": "Gas Energy Conversion (therms to kWh)",
    "formula": "kWh = therms * THERM_TO_KWH",
    "assumptions": {
      "THERM_TO_KWH": "29.3001 kWh/therm"
    },
    "code": [
      "evaluations/energy.py:therms_to_kwh"
    ]
  },
  "energy.effective_price_per_kwh": {
    "title": "Effective Price per kWh",
    "formula": "price_per_kwh = annual_cost / annual_kwh",
    "assumptions": {
      "returns": "0.0 when annual_kwh <= 0"
    },
    "code": [
      "evaluations/energy.py:effective_price_per_kwh"
    ]
  },
  "npv.npv": {
    "title": "Net Present Value (NPV)",
    "formula": "NPV = sum_{t=0..N} cashflow_t / (1 + r)^t",
    "assumptions": {
      "discount_rate": "real rate, provided by caller",
      "cashflow_t": "t=0 is up-front cost; t>=1 are annual flows"
    },
    "data_sources": {
      "cashflows": "caller-provided sequences (varies by evaluation)"
    },
    "code": [
      "evaluations/npv.py:npv"
    ],
    "notes": "No sign convention enforced; callers must supply costs/benefits."
  },
  "npv.compute_npv_details_from_inputs": {
    "title": "NPV Details (Solar+Storage vs All Electrification)",
    "formula": "NPV = -capex + sum_{t=1..N} savings_t / (1 + r)^t",
    "assumptions": {
      "solar_storage_savings": "scenario_cost - scenario_solar_cost",
      "all_electrification_savings": "baseline_cost - scenario_solar_cost",
      "horizon_years": "default 25",
      "discount_rate": "default 0.07"
    },
    "data_sources": {
      "baseline_cost": "totals results (baseline)",
      "scenario_cost": "totals results (scenario, no solar)",
      "scenario_solar_cost": "solarstorage totals results",
      "pv_storage_net_capex": "capital_costs_summary_with_pv",
      "electrification_net_capex": "capital_costs_<scenario>_<housing>"
    },
    "code": [
      "evaluations/npv.py:compute_npv_details_from_inputs",
      "helpers/diagnostics_data.py:compute_npv_details"
    ]
  },
  "npv.annuity_factor": {
    "title": "Annuity Factor (NPV to EAC)",
    "formula": "A = r / (1 - (1 + r)^-n)",
    "assumptions": {
      "returns": "1/n when r <= 0; 1.0 when n <= 0"
    },
    "code": [
      "evaluations/npv.py:annuity_factor"
    ],
    "notes": "Used to convert NPV to an equivalent annual amount."
  },
  "eac.crf": {
    "title": "Capital Recovery Factor (CRF)",
    "formula": "CRF = r(1+r)^n / ((1+r)^n - 1)",
    "assumptions": {
      "returns": "1/n when r <= 0; 1.0 when n <= 0"
    },
    "code": [
      "evaluations/eac.py:crf"
    ]
  },
  "eac.EACComponents": {
    "title": "EAC Components (Data Structure)",
    "assumptions": {
      "units": "All values are $/year except annual_bill_* which are already annual flows."
    },
    "data_sources": {
      "capex_pv": "annualized PV capex",
      "capex_storage": "annualized storage capex",
      "capex_electric": "annualized electrification capex",
      "capex_gas": "annualized gas capex",
      "annual_bill_electric": "annual electricity bill",
      "annual_bill_gas": "annual gas bill",
      "vehicle_om": "annual vehicle O&M adders"
    },
    "code": [
      "evaluations/eac.py:EACComponents"
    ]
  },
  "eac.alpha_batt_npv": {
    "title": "Battery Capex Coefficient under NPV Framing",
    "formula": "alpha_batt = (1 + (1+r)^(-n_batt)) / PVA(r, N)",
    "assumptions": {
      "derivation": "Over a horizon N, a battery with lifetime n_batt < N requires replacement at t=n_batt. K_batt = 1 + (1+r)^(-n_batt) is the present value of both purchases. Dividing by PVA(r,N) = (1-(1+r)^(-N))/r converts to annual-equivalent cost.",
      "vs_crf": "alpha_batt > CRF(r, n_batt) because CRF prices only one battery purchase. At r=0.07, n_batt=15, N=25: alpha_batt=0.1169 vs CRF=0.1098 (+6.4%).",
      "pv_unchanged": "For PV, n_pv = N = 25, so K_pv = 1 and alpha_pv = 1/PVA = CRF(r, N). No change to PV coefficient."
    },
    "code": [
      "evaluations/eac.py:alpha_batt_npv",
      "pipeline/steps/step9b_cooptimize_core.py:_solve_lp"
    ]
  },
  "eac.compute_eac_from_inputs": {
    "title": "Equivalent Annual Cost (EAC)",
    "formula": "EAC = annualized_capex_pv + annualized_capex_storage + annualized_capex_electric + annualized_capex_gas + annual_bill_electric + annual_bill_gas + vehicle_om",
    "assumptions": {
      "discount_rate": "0.07 real (default unless overridden)",
      "lifetimes": "solar=25, storage=15, appliance rows use lifetime_years (default 15 if missing)",
      "incentives": "full/half/no incentives applied to PV/storage capex",
      "capital_recovery_factor": "CRF = r(1+r)^n / ((1+r)^n - 1)",
      "npv_framing": "When npv_framing=True, storage uses alpha_batt_npv instead of CRF — see eac.alpha_batt_npv"
    },
    "data_sources": {
      "capex_ledger": "capital_costs_<scenario>_<housing>.csv",
      "pv_summary": "capital_costs_summary_with_pv_<scenario>_<housing>.csv",
      "annual_bills": "RESULTS_electricity_annual_costs_* and RESULTS_gas_annual_costs_*",
      "vehicle_om": "ledger rows: appliance_type in {vehicle_charging, vehicle_fuel}"
    },
    "code": [
      "evaluations/eac.py:compute_eac_from_inputs",
      "helpers/plot_scenario_comparison_helper.py:collect_eac_components",
      "pipeline/steps/step20_no_solar_storage_electrification.py:collect_eac_no_pv"
    ]
  },
  "incentives.apply_pv_storage_incentives": {
    "title": "PV/Storage Incentives (Net Capex)",
    "formula": "net_capex = capex - incentive; half_incentives applies 50% of full incentive",
    "assumptions": {
      "incentive": "full_incentives | half_incentives | no_incentives"
    },
    "code": [
      "evaluations/incentives.py:apply_pv_storage_incentives"
    ]
  },
  "payback.choose_annual_savings": {
    "title": "Annual Savings Selection (Payback)",
    "formula": "with_solar = baseline - scenario_solar; scenario_only = baseline - scenario",
    "assumptions": {
      "preference_order": "with_solar (if positive), then scenario_only (if positive), else no_savings",
      "no_savings_value": "0.01 (epsilon to avoid divide-by-zero in callers)"
    },
    "code": [
      "evaluations/payback_periods.py:choose_annual_savings"
    ]
  },
  "payback.compute_payback_years": {
    "title": "Simple Payback Period",
    "formula": "payback_years = net_capital_cost / annual_savings",
    "assumptions": {
      "returns": "inf when annual_savings <= 0"
    },
    "code": [
      "evaluations/payback_periods.py:compute_payback_years"
    ]
  },
  "tariffs.select_row_value_for_plan": {
    "title": "Tariff Plan Selection (Electricity)",
    "assumptions": {
      "variant": "nem3 filters to columns ending with _NEM3; retail filters to non-NEM3 electricity columns",
      "plan_preference": "ordered substrings matched against electricity.* columns",
      "fallbacks": "first numeric electricity column, then first numeric in row, then 0.0"
    },
    "data_sources": {
      "row": "results row with electricity.* columns"
    },
    "code": [
      "evaluations/tariffs.py:select_row_value_for_plan"
    ],
    "notes": "This selector is permissive; strict selection is enforced in some downstream helpers."
  },
  "vehicles.vehicle_annual_adders_from_ledger": {
    "title": "Vehicle O&M Adders from Ledger",
    "formula": "Sum annual_operating_cost by county and vehicle type",
    "assumptions": {
      "ev_rows": "appliance_category='electric' AND appliance_type='vehicle_charging'",
      "ice_rows": "appliance_category='gas' AND appliance_type='vehicle_fuel'",
      "missing_columns": "filled with 0.0 or '' for safe grouping"
    },
    "data_sources": {
      "ledger_df": "capital_costs_<scenario>_<housing>.csv"
    },
    "code": [
      "evaluations/vehicles.py:vehicle_annual_adders_from_ledger"
    ]
  },
  "lcoe.present_value_energy": {
    "title": "Present Value of Energy (with degradation)",
    "formula": "PV(E) = sum_{t=1..N} (annual_kwh_year1 * (1 - d)^(t-1)) / (1 + r)^t",
    "assumptions": {
      "degradation_rate": "d per year (default 0.0)",
      "returns": "0.0 if annual_kwh_year1 <= 0 or N <= 0"
    },
    "code": [
      "evaluations/lcoe.py:present_value_energy"
    ]
  },
  "lcoe.lcoe_crf_simple": {
    "title": "LCOE (CRF, constant annual generation)",
    "formula": "(capex * CRF + fixed_om + variable_om_per_kwh * annual_kwh) / annual_kwh",
    "assumptions": {
      "annual_kwh": "constant each year (no degradation)",
      "returns": "0.0 if annual_kwh <= 0"
    },
    "data_sources": {
      "capex": "caller-provided",
      "annual_kwh": "caller-provided"
    },
    "code": [
      "evaluations/lcoe.py:lcoe_crf_simple",
      "helpers/plot_scenario_comparison_helper.py:collect_pv_lcoe"
    ],
    "notes": "Used for scenario comparison LCOE summaries; no degradation or O&M."
  },
  "lcoe.lcoe_npv_from_params": {
    "title": "LCOE (NPV cost / NPV energy)",
    "formula": "LCOE = PV(costs) / PV(energy)",
    "assumptions": {
      "costs": "capex at t=0; fixed O&M and variable O&M tied to energy each year",
      "energy": "annual_kwh_year1 degraded by (1 - d)^(t-1)",
      "returns": "0.0 if PV(energy) == 0"
    },
    "code": [
      "evaluations/lcoe.py:lcoe_npv_from_params"
    ]
  },
  "lcoe.lcoe_from_schedules": {
    "title": "LCOE from Explicit Schedules",
    "formula": "LCOE = PV(costs) / PV(energy)",
    "assumptions": {
      "annual_costs": "include t=0 capex as first element",
      "annual_generation_kwh": "energy per year; prepend 0 for t=0 to align with NPV"
    },
    "code": [
      "evaluations/lcoe.py:lcoe_from_schedules"
    ]
  },
  "appliances.solar_system": {
    "title": "Solar PV Installed Cost",
    "formula": "total_cost = capacity_kw * 1000 * $3.30/W",
    "data_sources": {
      "rate": "$3.30/W, CPUC-adopted 2023 California solar cost (docs.cpuc.ca.gov/PublishedDocs/Published/G000/M499/K921/499921246.PDF). Reconciles NREL ATB ($2.34/W, too low) vs. LBNL Tracking the Sun 2019 ($3.80/W, too high); accounts for panel upgrades, delays, inflation."
    },
    "assumptions": {
      "sizing_vs_reporting": "SolarSystemAppliance.per_kw_cost() is the single source of truth for this rate — the LP's sizing objective (step9b) must use the same value the reporting layer (step14) uses, or the LP optimizes against a price it isn't actually charged. Bug found and fixed 2026-07-06."
    },
    "code": [
      "appliances/solar_system.py:SolarSystemAppliance",
      "appliances/solar_system.py:per_kw_cost"
    ]
  },
  "appliances.battery_storage": {
    "title": "Battery Storage Installed Cost",
    "formula": "total_cost = num_units * $18,258 (12.5 kWh/unit)",
    "data_sources": {
      "rate": "NREL ATB 2024 moderate scenario, residential 5kW/12.5kWh system, as used in CEC-200-2024-011 (energy.ca.gov/sites/default/files/2024-07/CEC-200-2024-011.pdf). ATB via atb.nrel.gov/electricity/2024/data."
    },
    "assumptions": {
      "sizing_vs_reporting": "BatteryStorageAppliance.per_kwh_cost() is the single source of truth for this rate — see appliances.solar_system note. Bug found and fixed 2026-07-06: LP previously sized against a stale $800/kWh default while this reporting rate was ~$1,461/kWh gross."
    },
    "code": [
      "appliances/battery_storage.py:BatteryStorageAppliance",
      "appliances/battery_storage.py:per_kwh_cost"
    ]
  },
  "appliances.electric_heating": {
    "title": "Heat Pump Space Heating Installed Cost (per county)",
    "formula": "base_cost = County_Median_HPSH_Stats.csv[county]['Total Project Cost per Unit ($)']",
    "data_sources": {
      "source": "TECH Clean California program data (CEC), filtered to ducted systems only (AHRI types without the '-O' suffix). Contractor/turnkey cost, not equipment-only. See Simon La Vieille, 'EV Integration to Ana's Project' (Aug 2025), section 'Heat Pump - Space Heater'.",
      "file": "data/County_Median_HPSH_Stats.csv",
      "missing_counties": "3 of the pipeline's 47 counties (mono, plumas, sierra) absent from source; filled with the median of counties present (computed in for_county(), not hardcoded)."
    },
    "code": [
      "appliances/electric_heating.py:for_county"
    ]
  },
  "appliances.electric_water_heating": {
    "title": "Heat Pump Water Heater Installed Cost (per county)",
    "formula": "base_cost = County_Median_HPWH_Stats.csv[county]['Total Project Cost per Unit ($)']",
    "data_sources": {
      "source": "TECH Clean California program data (CEC), Single Family installs of Heat Pump Water Heater / Split System HPWH / 120V and 240V integrated HPWH. Contractor/turnkey cost. See Simon La Vieille, 'EV Integration to Ana's Project' (Aug 2025), section 'Heat Pump Water Heater'.",
      "file": "data/County_Median_HPWH_Stats.csv",
      "missing_counties": "9 of the pipeline's 47 counties absent from source; filled with the median of counties present (computed in for_county(), not hardcoded)."
    },
    "code": [
      "appliances/electric_water_heating.py:for_county"
    ]
  },
  "appliances.carb_appliance_costs": {
    "title": "Induction Stove / Gas Appliance Installed Costs",
    "formula": "base_cost_2023 = (capital + installation + other)_2022 * 1.034",
    "data_sources": {
      "source": "CARB appliance comparison data ('Cristina's approach'), 3.4% CPI-U inflation applied to bring 2022 figures to 2023. See Simon La Vieille, 'EV Integration to Ana's Project' (Aug 2025), section 'Rest of the Values'.",
      "induction_stove": "$2,400 + $1,380 + $340 = $4,120 (2022) -> $4,260.08 (2023)",
      "gas_stove": "$1,600 + $890 + $220 = $2,710 (2022) -> $2,802.14 (2023)",
      "gas_water_heater": "$900 + $1,200 + $90 = $2,190 (2022) -> $2,264.46 (2023)",
      "gas_heating": "$4,500 + $4,180 + $770 = $9,450 (2022) -> $9,771.30 (2023) — reported as 'Gas HVAC' in the source; confirm scope (heating-only vs. full HVAC incl. AC) matches intended use."
    },
    "code": [
      "appliances/electric_cooking.py:ElectricCookingAppliance",
      "appliances/gas_stove.py:GasStoveAppliance",
      "appliances/gas_water_heating.py:GasWaterHeatingAppliance",
      "appliances/gas_heating.py:GasHeatingAppliance"
    ]
  }
}
