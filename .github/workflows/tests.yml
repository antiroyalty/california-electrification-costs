name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest pytest-html pandas pulp "scipy>=1.9" numpy matplotlib requests geopandas geopy folium boto3 python-dotenv
      - run: pytest -q tests/ --html=test_report.html --self-contained-html
